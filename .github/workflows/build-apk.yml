# .github/workflows/build-apk.yml
# Islamic Hub — Native Android APK build workflow
# এই workflow টি debug + release APK তৈরি করে GitHub-এ artifact হিসেবে publish করে।
#
# Trigger:
#   - push to main / master
#   - pull_request to main
#   - manual dispatch (workflow_dispatch) — lets you pick build type
#
# Outputs:
#   - app-debug.apk      (debug artifact)
#   - app-release-unsigned.apk (release artifact, unsigned)

name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug / release / both)'
        required: true
        default: 'both'
        type: choice
        options: ['debug', 'release', 'both']

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for versionName from git tags if needed

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Verify project structure
        run: |
          echo "=== Project root ==="
          ls -la
          echo "=== app/src/main/assets/data/ ==="
          ls -la app/src/main/assets/data/ 2>/dev/null | head -20
          echo "=== app/src/main/res/drawable-nodpi/ (first 10) ==="
          ls app/src/main/res/drawable-nodpi/ 2>/dev/null | head -10
          echo "=== app/src/main/res/raw/ ==="
          ls app/src/main/res/raw/ 2>/dev/null

      - name: Build debug APK
        if: github.event.inputs.build_type != 'release'
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK (unsigned)
        if: github.event.inputs.build_type != 'debug'
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: List build outputs
        run: |
          echo "=== Build outputs ==="
          find app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload debug APK artifact
        if: github.event.inputs.build_type != 'release' && always()
        uses: actions/upload-artifact@v4
        with:
          name: islamichub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release APK artifact
        if: github.event.inputs.build_type != 'debug' && always()
        uses: actions/upload-artifact@v4
        with:
          name: islamichub-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build reports
        if: always() && failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: warn
          retention-days: 7
