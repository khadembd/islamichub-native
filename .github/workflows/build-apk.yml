# .github/workflows/build-apk.yml
# Islamic Hub — Native Android APK build workflow
# CLEAN BUILD — no Gradle cache to ensure latest code is always compiled
#
# Trigger:
#   - push to main / master
#   - pull_request to main
#   - manual dispatch

name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug / release / both)'
        required: true
        default: 'both'
        type: choice
        options: ['debug', 'release', 'both']

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      # NO Gradle cache — every build is a clean build to ensure
      # the latest source code is always compiled and packaged.

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Clean project
        run: ./gradlew clean --no-daemon

      - name: Verify project structure
        run: |
          echo "=== Project root ==="
          ls -la
          echo "=== app/src/main/assets/data/ ==="
          ls -la app/src/main/assets/data/ 2>/dev/null | head -20
          echo "=== app/src/main/res/drawable-nodpi/ (first 10) ==="
          ls app/src/main/res/drawable-nodpi/ 2>/dev/null | head -10
          echo "=== app/src/main/res/raw/ ==="
          ls app/src/main/res/raw/ 2>/dev/null
          echo "=== Kotlin file count ==="
          find app/src/main/java -name "*.kt" | wc -l
          echo "=== Layout count ==="
          find app/src/main/res/layout -name "*.xml" | wc -l

      - name: Build debug APK (clean build)
        if: github.event.inputs.build_type != 'release'
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon --no-build-cache

      - name: Build release APK (unsigned, clean build)
        if: github.event.inputs.build_type != 'debug'
        continue-on-error: true
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon --no-build-cache

      - name: List build outputs
        run: |
          echo "=== Build outputs ==="
          find app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} \;

      - name: Verify APK contains new code
        run: |
          echo "=== Checking APK contents ==="
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No debug APK found!"
            exit 1
          fi
          echo "APK: $APK_PATH"
          echo "=== Checking for new layouts in APK ==="
          unzip -l "$APK_PATH" | grep -E "res/layout/fragment_(namaz|misconceptions|questions|bookmarks|splash)" | head -10
          echo "=== Checking for premium backgrounds ==="
          unzip -l "$APK_PATH" | grep -E "bg_premium" | head -10
          echo "=== Checking splash screen ==="
          unzip -l "$APK_PATH" | grep -E "splash" | head -5
          echo "=== APK file size ==="
          ls -lh "$APK_PATH"

      - name: Upload debug APK artifact
        if: github.event.inputs.build_type != 'release' && always()
        uses: actions/upload-artifact@v4
        with:
          name: islamichub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release APK artifact
        if: github.event.inputs.build_type != 'debug' && always()
        uses: actions/upload-artifact@v4
        with:
          name: islamichub-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build reports
        if: always() && failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: warn
          retention-days: 7
