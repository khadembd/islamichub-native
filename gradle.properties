# gradle.properties
# JVM args — Android Gradle Plugin 8.x requires JDK 17+
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8 -XX:+UseSerialGC
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Suppress unsupported compileSdk warnings until we move to a newer AGP
android.suppressUnsupportedCompileSdk=34
